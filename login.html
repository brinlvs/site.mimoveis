<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — MI. Móveis</title>
  <meta name="description" content="Área do cliente da MI. Móveis (página de demonstração).">
  <meta name="theme-color" content="#FFF8EF">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- aplica tema/tamanho salvos antes de pintar a página (evita "piscar") -->
  <script src="js/prefs-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body class="login-page">
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" focusable="false">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-access" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M5 8.5l7 1.5 7-1.5M12 10v5M9 21l3-6 3 6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z" fill="currentColor"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.3 4M6.5 6.6A17 17 0 0 0 2 12s4 7 10 7a9.7 9.7 0 0 0 4-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>

  <symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 3l5 7h-3l4 6H6l4-6H7z"/><path d="M12 16v5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3 1.3-6.2L3 9.5l6.3-.7z"/></symbol>
</svg>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="login-top">
    <a class="btn btn--ghost btn--sm" href="index.html"><svg class="icon " aria-hidden="true"><use href="#i-left"/></svg> Voltar ao site</a>
    <div class="header-actions">
      <button type="button" class="icon-btn theme-toggle" data-action="toggle-theme" aria-label="Ativar modo escuro"><svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"/></svg><svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"/></svg></button>
      <button type="button" class="icon-btn" data-action="open-a11y" aria-haspopup="dialog" aria-label="Abrir painel de acessibilidade"><svg class="icon " aria-hidden="true"><use href="#i-access"/></svg></button>
    </div>
  </header>

  <main id="conteudo" class="card login-card" tabindex="-1">
    <div class="brand-center"><img src="assets/logo.png" alt="MI. Móveis" width="200" height="141"></div>
    <h1>Entrar na sua conta</h1>
    <p class="sub">Área do cliente MI. Móveis</p>

    <form id="form-login" novalidate>
      <div class="form-summary" role="alert" tabindex="-1" hidden></div>

      <div class="field">
        <label for="email">E-mail <span class="req" aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required aria-required="true">
      </div>

      <div class="field">
        <label for="senha">Senha <span class="req" aria-hidden="true">*</span></label>
        <div class="pw-wrap">
          <input id="senha" name="senha" type="password" autocomplete="current-password" required aria-required="true" aria-describedby="senha-dica">
          <button type="button" class="pw-toggle" aria-pressed="false" aria-label="Mostrar senha"><svg class="icon icon-eye" aria-hidden="true"><use href="#i-eye"/></svg><svg class="icon icon-eye-off" aria-hidden="true"><use href="#i-eye-off"/></svg></button>
        </div>
        <span class="hint" id="senha-dica">Use pelo menos 6 caracteres.</span>
      </div>

      <div class="login-extra">
        <div class="check"><input id="lembrar" type="checkbox"><label for="lembrar">Lembrar meu e-mail</label></div>
        <button type="button" class="link-btn" id="esqueci">Esqueci minha senha</button>
      </div>

      <button type="submit" class="btn btn--primary btn--block">Entrar</button>
      <p class="login-note" id="login-status" role="status"></p>
    </form>

    <p style="text-align:center;margin:22px 0 0">Ainda não tem conta? <a href="index.html#contato">Fale com a gente</a>.</p>
    <p class="login-note">Esta tela é uma <strong>demonstração</strong>: ela valida os campos, mas não existe servidor. Nenhuma senha é guardada ou enviada.</p>
  </main>
</body>
</html>
